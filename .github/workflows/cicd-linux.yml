name: cicd-linux

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "Makefile"
      - "requirements.txt"
      - "version_fork.env"
      - "docker/**"
      - ".github/trigger.txt"
      - ".github/workflows/cicd-linux.yml"

# Static analysis + the wasm QA, on Linux.
#
# The point of this job is that it builds the wasm in the pinned Docker image and
# then runs the QA against THAT artifact -- the exact bytes a release ships.
# `make test-llm-wasm` rebuilds on the host and would test different bytes (the
# absolute source paths baked in via GGML_ABORT/__FILE__ differ), which is what
# the macOS job used to do.
#
# The native MockIC tests are NOT here: they stay on macos-15-intel in
# cicd-mac.yml. The native build does not compile on Linux -- src/utils.h uses
# std::filesystem without including <filesystem> and src/main_.cpp includes
# <format> (libstdc++ 13+), and ggml-cpu.c's Linux-only sched-affinity paths
# (CPU_ZERO, pthread_getaffinity_np, getcpu) need -D_GNU_SOURCE. Those tests also
# assert exact token hexes that are baselined on x86_64 macOS.
jobs:
  wasm-static:
    name: wasm+static
    runs-on: ubuntu-22.04

    steps:
      - name: checkout llama_cpp_canister
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: read fork pin
        run: grep -E '^[A-Z_]+=' version_fork.env >> "$GITHUB_ENV"

      # The Docker build does NOT use this checkout -- .dockerignore excludes
      # src/llama_cpp_onicai_fork/ from the build context, and the image clones
      # the pinned commit itself. It is here because part of the QA inspects the
      # vendored fork's SOURCE rather than the canister's behaviour:
      # test_upgrade_regressions.py asserts the ICPP-PATCHes are still present in
      # ggml-backend.cpp, which is the thing a fork re-vendor silently drops.
      #
      # Both this checkout and the image's clone resolve FORK_COMMIT from
      # version_fork.env, so they cannot drift apart.
      - name: checkout llama_cpp_onicai_fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.FORK_COMMIT }}
          path: src/llama_cpp_onicai_fork
          fetch-depth: 1
          submodules: 'recursive'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # icp-cli is installed via npm and needs Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install
        run: |
          echo "Installing tool chains & dependencies"
          make summary
          make install-icp
          make install-python

      # clang-format (used by all-static) ships inside the wasi-sdk.
      - name: install-wasi-sdk
        run: icpp install-wasi-sdk

      - name: versions
        run: |
          echo "Runner OS  : $RUNNER_OS $(uname -m)"
          echo "OS version : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "python     : $(python --version)"
          echo "icpp       : $(icpp --version | tr '\n' ' ')"
          echo "icp        : $(icp --version)"
          echo "node       : $(node --version)"
          echo "docker     : $(docker --version)"

      - name: all-static
        run: make all-static

      # A cold cache is part of the guarantee: a stale layer could otherwise mask
      # a step that is not actually reproducible.
      - name: clean docker build cache
        run: docker builder prune --all --force

      - name: build Docker base image
        run: make docker-build-base

      - name: build wasm with Docker
        run: make docker-build-wasm

      - name: Download gemma-3-270M model (small-max_tokens prompt-cache regression)
        run: |
          mkdir -p ./models/google/gemma-3-270m-it-GGUF
          wget -nv -O ./models/google/gemma-3-270m-it-GGUF/gemma-3-270m-it-Q8_0.gguf https://huggingface.co/unsloth/gemma-3-270m-it-GGUF/resolve/main/gemma-3-270m-it-Q8_0.gguf?download=true

      - name: test-llm-wasm (against the Docker-built wasm)
        # `icp network start` downloads the network-launcher via the GitHub API.
        # Unauthenticated that is 60 req/hour shared across all GitHub-hosted
        # runners, so authenticate with the job's token to avoid 403 rate limits.
        env:
          ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test-llm-wasm-prebuilt
