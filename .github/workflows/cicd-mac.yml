name: cicd-mac

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "native/**"
      - "src/**"
      - "Makefile"
      # Compile flags and the source list: these decide the wasm bytes.
      - "icpp.toml"
      - "requirements.txt"
      # Bumping the pinned llama.cpp fork commit changes what is built and tested.
      - "version_fork.env"
      - ".github/trigger.txt"
      - ".github/workflows/cicd-mac.yml"

# Supersede in-flight runs for the same branch: a new push to a PR cancels the
# previous run instead of letting it hold a runner for work that is already
# obsolete. macos-15-intel in particular is scarce and shared across this
# account's repos.
#
# The guard matters: runs on main are NEVER cancelled, so merge-commit CI and
# the evidence behind a release stay intact. release.yml deliberately has no
# concurrency block at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The native MockIC tests, and ONLY those. They carry ~59 exact-hex token
# assertions that depend on the host libm's last-ULP behaviour, so they are
# pinned to x86_64 macOS (macos-15-intel) to match the baselines they were
# recorded against. See the ci-mac-runner-and-exact-tokens note.
#
# Everything else -- all-static, and the wasm QA -- moved to cicd-linux.yml,
# which builds the wasm in the pinned Docker image and tests THAT artifact, so CI
# exercises the exact bytes a release ships. A macOS runner has no Docker, so it
# cannot do that.
#
# The native build does not compile on Linux at all: src/utils.h uses
# std::filesystem without including <filesystem>, src/main_.cpp includes <format>
# (libstdc++ 13+), and ggml-cpu.c's Linux-only sched-affinity paths need
# -D_GNU_SOURCE. That is why this job stays here.
jobs:
  cicd-mac:
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: native (x86_64 exact-token)
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      # https://github.com/marketplace/actions/setup-miniconda
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"

      # -------------------------------------------------------------------
      # Checkout llama_cpp_canister & llama_cpp_onicai_fork as nested directory
      - name: checkout llama_cpp_canister
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pinned fork commit, shared with the Docker build and release.yml.
      - name: read fork pin
        run: grep -E '^[A-Z_]+=' version_fork.env >> "$GITHUB_ENV"

      - name: checkout llama_cpp_onicai_fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          # Pinned to an exact commit via version_fork.env, not the moving
          # `onicai` branch: otherwise a push to the fork silently changes what
          # CI tests, with no commit in this repo to show for it.
          ref: ${{ env.FORK_COMMIT }}
          path: src/llama_cpp_onicai_fork
          fetch-depth: 1 # Get just the pinned commit
          submodules: 'recursive'
      # -------------------------------------------------------------------

      - name: install
        shell: bash -l {0} # activates the default conda environment ('test')
        run: |
          echo "Installing tool chains & dependencies"
          pwd
          make summary
          make install-icp
          make install-python
          make install-homebrew-mac
          make install-jp-mac

      - name: versions
        shell: bash -l {0}
        run: |
          echo "icpp --version: $(icpp --version)"
          echo "clang++ --version: $(clang++ --version)"
          echo "g++ --version: $(g++ --version)"
          #echo "wasm2wat version: $(wasm2wat --version)"
          echo "pip version     : $(pip --version)"
          echo "python version  : $(python --version)"
          echo "jp version      : $(jp --version)"
          #echo "rustc version   : $(rustc --version)"
          echo "icp version    : $(icp --version)"
          echo "Ensure conda works properly"
          conda info
          which pip
          which python
          which icpp

      - name: install-wasi-sdk
        shell: bash -l {0}
        run: |
          echo "Installing wasi-sdk"
          icpp install-wasi-sdk

      - name: install-rust
        shell: bash -l {0}
        run: |
          echo "Installing rust"
          icpp install-rust

      - name: build-info-cpp-wasm
        shell: bash -l {0}
        run: |
          make build-info-cpp-wasm

      # --- native job: Qwen models are loaded by the native MockIC tests --------
      - name: Download Qwen3 model (current default reference model)
        if: matrix.job == 'native (x86_64 exact-token)'
        run: |
          mkdir -p ./models/Qwen/Qwen3-0.6B-GGUF
          wget -nv -O ./models/Qwen/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true

      - name: Download Qwen2.5 model (kept for regression)
        if: matrix.job == 'native (x86_64 exact-token)'
        run: |
          mkdir -p ./models/Qwen/Qwen2.5-0.5B-Instruct-GGUF
          wget -nv -O ./models/Qwen/Qwen2.5-0.5B-Instruct-GGUF/qwen2.5-0.5b-instruct-q8_0.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf?download=true

      - name: test-llm-native
        if: matrix.job == 'native (x86_64 exact-token)'
        shell: bash -l {0}
        run: |
          make test-llm-native
