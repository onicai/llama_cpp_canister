name: Release llama_cpp_canister

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g., v0.16.5)"
        required: true

permissions:
  contents: write  # to create the release

jobs:
  check-cicd-mac-status:
    name: Check if cicd-mac succeeded
    # Only runs `gh run list`, so it does not need a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the latest `cicd-mac.yml` run status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching the latest run of cicd-mac..."
          latest_run=$(gh run list --repo ${{ github.repository }} \
            --workflow="cicd-mac.yml" --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$latest_run" != "success" ]; then
            echo "The latest cicd-mac run was not successful ($latest_run). Exiting."
            exit 1
          fi
          echo "The latest cicd-mac run was successful."

  release:
    name: Build and Release
    needs: check-cicd-mac-status
    # The wasm is built inside a pinned linux/amd64 Docker image, NOT on the
    # runner, so that anyone can reproduce this exact artifact with
    # `make docker-build-wasm`. GitHub's macOS runners cannot run Linux
    # containers, which is why this job moved off macos-15-intel.
    #
    # The exact-token NATIVE tests stay on macos-15-intel, in cicd-mac.yml, and
    # this job is gated on them above. Docker replaces the build, not the tests.
    runs-on: ubuntu-22.04

    steps:
      - name: checkout llama_cpp_canister
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pinned llama.cpp fork commit. The Docker build clones it itself, so
      # the fork is deliberately NOT checked out on the runner.
      - name: read fork pin
        run: grep -E '^[A-Z_]+=' version_fork.env >> "$GITHUB_ENV"

      # A cold cache is part of the guarantee: a stale layer could otherwise
      # mask a step that is not actually reproducible.
      - name: clean docker build cache
        run: docker builder prune --all --force

      - name: versions
        run: |
          echo "Runner OS    : $RUNNER_OS $(uname -m)"
          echo "OS version   : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "Docker       : $(docker --version)"
          echo "fork commit  : ${FORK_COMMIT}"
          echo "fork build # : ${FORK_BUILD_NUMBER}"

      - name: build Docker base image
        run: make docker-build-base

      - name: build wasm with Docker
        run: make docker-build-wasm

      - name: compute hashes
        id: hashes
        run: |
          set -euo pipefail
          WASM_SHA256=$(sha256sum out/llama_cpp.wasm | cut -d ' ' -f 1)
          ICPP_VERSION=$(grep -E '^icpp-pro==' requirements.txt | cut -d '=' -f 3)
          {
            echo "wasm_sha256=${WASM_SHA256}"
            echo "icpp_version=${ICPP_VERSION}"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          # Surface it in the run summary too, so the release skill can copy the
          # value into WASM-HASHES.md without re-deriving it.
          {
            echo "## llama_cpp.wasm"
            echo ""
            echo '| | |'
            echo '| --- | --- |'
            echo "| sha256 | \`${WASM_SHA256}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| fork commit | \`${FORK_COMMIT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zip Release Files
        run: |
          set -euo pipefail
          mkdir -p release/build release/scripts release/test
          mkdir -p release/src/llama_cpp_onicai_fork
          cp version.txt requirements.txt README.md icp.yaml LICENSE __init__.py release/
          cp out/llama_cpp.wasm out/llama_cpp.did out/llama_cpp.wasm.sha256 release/build/
          cp out/BUILD-PROVENANCE.txt release/
          cp scripts/__init__.py release/scripts/
          cp scripts/download.py release/scripts/
          cp scripts/ic_py_canister.py release/scripts/
          cp scripts/parse_args_download.py release/scripts/
          cp scripts/parse_args_upload.py release/scripts/
          cp scripts/upload.py release/scripts/
          cp scripts/calculate_sha256.py release/scripts/
          cp scripts/requirements.txt release/scripts/
          # These come out of the container: the fork is not on the runner.
          cp    out/fork/requirements.txt release/src/llama_cpp_onicai_fork/
          cp -r out/fork/requirements     release/src/llama_cpp_onicai_fork/
          cp test/*.py release/test/
          (cd release && zip -qr ../llama_cpp_canister_${{ github.event.inputs.tag }}.zip .)
          # Also publish the bare wasm + hash, so verifying a release is a
          # `curl | sha256sum` with no unzip step.
          cp out/llama_cpp.wasm        llama_cpp.wasm
          cp out/llama_cpp.wasm.sha256 llama_cpp.wasm.sha256

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          ## Reproducible build

          | | |
          | --- | --- |
          | **\`llama_cpp.wasm\` sha256** | \`${{ steps.hashes.outputs.wasm_sha256 }}\` |
          | **llama_cpp_canister commit** | [\`${GITHUB_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}) |
          | **llama_cpp_onicai_fork commit** | [\`${FORK_COMMIT}\`](https://github.com/${FORK_REPO}/commit/${FORK_COMMIT}) |
          | **built with** | Docker, \`linux/amd64\`, icpp-pro ${{ steps.hashes.outputs.icpp_version }} |
          | **built on** | ${{ steps.hashes.outputs.date }} |

          ### Reproduce this wasm yourself

          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git
          cd llama_cpp_canister
          git checkout ${GITHUB_SHA}
          make docker-build-base
          make docker-build-wasm
          \`\`\`

          The last command prints the sha256. It must equal
          \`${{ steps.hashes.outputs.wasm_sha256 }}\`.

          No Mac and no local toolchain are needed: the llama.cpp fork commit,
          icpp-pro, wasi-sdk, Rust and Binaryen are all pinned inside the image.

          ### Check what a deployed canister is running

          Anyone can read a deployed module hash, with no special rights, from the
          public read-state path:

          \`\`\`bash
          dfx canister --network ic info <canister-id>
          \`\`\`

          It must print \`Module hash: 0x${{ steps.hashes.outputs.wasm_sha256 }}\`.

          If you control the canister you can instead build and compare in one step:

          \`\`\`bash
          make docker-verify-wasm VERIFY_CANISTER=<canister-id>
          \`\`\`

          (That target uses \`icp canister status\`, a controller-only management
          call; it fails with IC0542 for anyone else.)
          EOF
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llama_cpp_canister_${{ github.event.inputs.tag }}.zip
            llama_cpp.wasm
            llama_cpp.wasm.sha256
          tag_name: ${{ github.event.inputs.tag }}
          # The hash is in the title as well as the body, so it is visible in the
          # releases LIST, not only on the detail page.
          name: "${{ github.event.inputs.tag }} — wasm ${{ steps.hashes.outputs.wasm_sha256 }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
